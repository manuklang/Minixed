<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pitch-Meister 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap">
<style>
:root{
  --bg:#eef1f5; --bg2:#e6eaf0; --panel:#ffffff; --panel2:#f6f8fb; --line:#dfe4ec; --line2:#c9d1dc;
  --text:#2c3340; --muted:#6b7585; --faint:#98a1af;
  --brand:#1f3d74; --brand2:#2d5aa8; --brandSoft:#e4ecf8; --accent:#e0a21b;
  --ok:#2f8f5b; --okSoft:#e2f3ea; --warn:#c0392b; --warnSoft:#fbe7e4;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 16px rgba(20,30,50,.06);
  --onBrand:#fff; --r:12px; --font:"Gill Sans","Gill Sans MT","Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181f; --bg2:#1a1f28; --panel:#1e242e; --panel2:#232a35; --line:#2e3642; --line2:#3a4452;
    --text:#e4e8ef; --muted:#a2acba; --faint:#76808f;
    --brand:#7fa6ea; --brand2:#9dbbf0; --brandSoft:#243248; --accent:#f0b73a;
    --ok:#5cc28b; --okSoft:#1d3328; --warn:#ef7a6c; --warnSoft:#3a2321;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); --onBrand:#10151d;
  }
}
:root[data-theme="dark"]{
  --bg:#14181f; --bg2:#1a1f28; --panel:#1e242e; --panel2:#232a35; --line:#2e3642; --line2:#3a4452;
  --text:#e4e8ef; --muted:#a2acba; --faint:#76808f;
  --brand:#7fa6ea; --brand2:#9dbbf0; --brandSoft:#243248; --accent:#f0b73a;
  --ok:#5cc28b; --okSoft:#1d3328; --warn:#ef7a6c; --warnSoft:#3a2321;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); --onBrand:#10151d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand2)}
#app{display:grid;grid-template-columns:232px 1fr;grid-template-rows:60px 1fr;height:100vh;height:100dvh}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:300;letter-spacing:.06em;font-size:20px;white-space:nowrap}
.logo b{font-weight:500}
.logo .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-weight:600;font-size:14px;letter-spacing:0}
.top .proj{margin-left:12px;min-width:0;flex:1;display:flex;align-items:center;gap:8px}
.top .proj select{max-width:340px}
.top .status{font-size:12px;color:var(--faint);white-space:nowrap}
.userchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;background:var(--panel2);cursor:pointer}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600;flex:none}
nav.side{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;overflow:auto}
nav.side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);margin:14px 10px 6px}
nav.side .grp:first-child{margin-top:2px}
nav.side button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:9px;cursor:pointer;text-align:left;color:var(--muted)}
nav.side button:hover{background:var(--panel2);color:var(--text)}
nav.side button.on{background:var(--brandSoft);color:var(--brand);font-weight:500}
nav.side button:disabled{opacity:.4;cursor:default}
nav.side svg{width:18px;height:18px;flex:none}
nav.side .cnt{margin-left:auto;font-size:11px;color:var(--faint)}
main{overflow:auto;padding:24px 28px 80px}
h1{font-weight:300;font-size:28px;letter-spacing:.03em;margin:0}
h2{font-weight:500;font-size:16px;margin:0 0 12px}
h3{font-weight:500;font-size:14px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.pagehead .sub{color:var(--muted);font-size:14px;margin-top:2px}
.pagehead .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.stack>*+*{margin-top:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted);letter-spacing:.02em}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px var(--brandSoft)}
textarea{resize:vertical;min-height:90px}
input[type=checkbox]{width:16px;height:16px;padding:0;accent-color:var(--brand2);flex:none}
input[type=color]{padding:2px;height:36px;width:46px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:7px 13px;cursor:pointer;white-space:nowrap;font-size:14px}
.btn:hover{border-color:var(--brand2);color:var(--brand)}
.btn.pri,.btn.pri:hover{background:var(--brand);border-color:var(--brand);color:var(--onBrand)}
.btn.pri:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger:hover{border-color:var(--warn);color:var(--warn)}
.icon-btn{border:0;background:none;cursor:pointer;color:var(--faint);padding:4px;border-radius:6px;line-height:1}
.icon-btn:hover{color:var(--warn);background:var(--warnSoft)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap;letter-spacing:.02em}
.chip .dot{width:8px;height:8px;border-radius:50%}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1.5px dashed var(--line2);border-radius:var(--r)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow:auto}
/* project cards */
.pcard{cursor:pointer;transition:transform .15s,border-color .15s;display:flex;flex-direction:column;gap:10px}
.pcard:hover{border-color:var(--brand2);transform:translateY(-2px)}
.pcard .t{font-size:18px;font-weight:500}
.pcard.active{border-color:var(--brand);box-shadow:0 0 0 2px var(--brandSoft),var(--shadow)}
.meter{height:6px;border-radius:4px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.meter>i{display:block;height:100%;background:var(--brand2)}
.meter.over>i{background:var(--warn)}
/* timeline */
.timeline{display:flex;gap:4px;align-items:stretch;width:100%}
.tl-seg{display:flex;flex-direction:column;gap:4px;min-width:24px}
.tl-bar{display:flex;height:34px;border-radius:6px;overflow:hidden;background:var(--panel2);border:1px solid var(--line)}
.tl-bar>div{min-width:3px;border-right:1px solid rgba(255,255,255,.55);cursor:pointer;position:relative}
.tl-bar>div:hover{filter:brightness(1.12)}
.tl-lab{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* storyboard board */
.board{display:flex;gap:16px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{flex:0 0 290px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.col.drop{border-color:var(--brand2);background:var(--brandSoft)}
.colhead{display:flex;align-items:center;gap:6px}
.colhead input{font-weight:500;background:transparent;border-color:transparent;padding:5px 6px}
.colhead input:hover{border-color:var(--line)}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s}
.scard:hover{border-color:var(--brand2)}
.scard.dragging{opacity:.4}
.scard.dropbefore{box-shadow:0 -3px 0 var(--brand2)}
.scard .thumb{aspect-ratio:16/9;background:var(--panel2);display:grid;place-items:center;color:var(--faint);font-size:12px;overflow:hidden;position:relative}
.scard .thumb img,.scard .thumb video{width:100%;height:100%;object-fit:cover}
.scard .thumb .num{position:absolute;left:8px;top:8px;background:rgba(15,25,45,.72);color:#fff;font-size:11px;padding:2px 7px;border-radius:6px}
.scard .thumb .dur{position:absolute;right:8px;top:8px;background:rgba(15,25,45,.72);color:#fff;font-size:11px;padding:2px 7px;border-radius:6px;font-variant-numeric:tabular-nums}
.scard .body{padding:9px 11px;display:flex;flex-direction:column;gap:6px}
.scard .name{font-weight:500;font-size:14px}
.addscene{border:1.5px dashed var(--line2);border-radius:10px;padding:12px;text-align:center;color:var(--muted);cursor:pointer;background:none;width:100%}
.addscene:hover{border-color:var(--brand2);color:var(--brand)}
/* scene editor */
.scene-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr) minmax(0,1fr);gap:16px}
.media{aspect-ratio:4/3;background:var(--panel2);border:1.5px dashed var(--line2);border-radius:10px;display:grid;place-items:center;overflow:hidden;position:relative;color:var(--muted);text-align:center}
.media img,.media video{width:100%;height:100%;object-fit:contain;background:#000}
.media .ov{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.checklist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.checklist label{display:flex;gap:9px;align-items:flex-start;padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.checklist label:last-child{border-bottom:0}
.checklist label:hover{background:var(--panel)}
.checklist label.on{background:var(--brandSoft)}
.checklist .grouphead{padding:6px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);background:var(--panel);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:1px solid transparent;border-bottom:0;background:none;padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;color:var(--muted);margin-bottom:-1px}
.tabs button.on{background:var(--panel);border-color:var(--line);color:var(--text);font-weight:500}
.tabs .badge{font-size:11px;background:var(--brandSoft);color:var(--brand);border-radius:999px;padding:0 6px;margin-left:4px}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.toggle input{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:999px;background:var(--line2);position:relative;border:0;padding:0;transition:background .15s;cursor:pointer}
.toggle input::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.toggle input:checked{background:var(--brand2)}
.toggle input:checked::after{left:18px}
.comment{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.comment:last-child{border-bottom:0}
.comment .meta{font-size:12px;color:var(--faint)}
/* images */
.imggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.imgtile{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2);display:flex;flex-direction:column}
.imgtile img,.imgtile video{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#000}
.imgtile .cap{display:flex;gap:4px;padding:6px}
.imgtile .cap input{padding:5px 8px;font-size:13px}
.item-img{width:72px;height:72px;border-radius:8px;object-fit:cover;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;color:var(--faint);font-size:11px;cursor:pointer;overflow:hidden;flex:none}
.item-img img{width:100%;height:100%;object-fit:cover}
.listrow{display:grid;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.listrow:last-child{border-bottom:0}
/* bars */
.bars{display:flex;flex-direction:column;gap:9px}
.barrow{display:grid;grid-template-columns:minmax(90px,170px) 1fr 104px;gap:10px;align-items:center;font-size:13.5px}
.barrow .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .track{height:14px;background:var(--panel2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.barrow .track i{display:block;height:100%;border-radius:3px}
.barrow .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .v{font-size:26px;font-weight:300;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .d{font-size:12.5px;margin-top:2px}
.pos{color:var(--ok)} .neg{color:var(--warn)}
.swatch{width:36px;height:36px;border-radius:8px;border:1px solid var(--line)}
.history{max-height:360px;overflow:auto}
.history td{font-size:13px}
.done td{color:var(--faint);text-decoration:line-through}
.modal{position:fixed;inset:0;background:rgba(10,15,25,.45);display:grid;place-items:center;z-index:60;padding:16px}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(440px,100%);box-shadow:var(--shadow)}
.mbox p{margin:0 0 16px}
.mbox textarea{min-height:240px;font:12px/1.4 ui-monospace,Menlo,monospace;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:50;box-shadow:var(--shadow);font-size:14px;max-width:90vw}
/* login */
.login{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(160deg,var(--bg),var(--bg2));z-index:40;padding:16px}
.login .box{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}
.login h1{font-size:30px;text-align:center}
.login .tag{text-align:center;color:var(--muted);margin:6px 0 22px;font-size:14px}
.userlist{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.userlist button{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);cursor:pointer;text-align:left}
.userlist button:hover{border-color:var(--brand2)}
.export-opts label.opt{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;align-items:flex-start;background:var(--panel)}
.export-opts label.opt.on{border-color:var(--brand2);background:var(--brandSoft)}
.export-opts input[type=radio]{width:16px;margin-top:3px;accent-color:var(--brand2)}
.preview-print{background:#fff;color:#222;border-radius:8px;padding:24px;max-height:70vh;overflow:auto;border:1px solid var(--line)}
#print{display:none}
.preview-print,#print{--bg:#fff;--bg2:#f3f5f8;--panel:#fff;--panel2:#f6f8fb;--line:#dfe4ec;--line2:#c9d1dc;--text:#222;--muted:#555;--faint:#888;--brand:#1f3d74;--brand2:#2d5aa8;--brandSoft:#e4ecf8;--ok:#2f8f5b;--warn:#c0392b;--accent:#e0a21b;--shadow:none;color:#222}
/* responsive (iPad / mobile) */
@media (max-width:1100px){ .scene-grid{grid-template-columns:1fr 1fr} .scene-grid>.c3{grid-column:1/-1} }
@media (max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  header.top{padding:10px 16px;flex-wrap:wrap;gap:10px}
  .top .proj{order:3;flex-basis:100%;margin:0}
  .top .proj select{max-width:none}
  .top .status{display:none}
  nav.side{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line)}
  nav.side .grp{display:none}
  nav.side button{width:auto;flex:none;white-space:nowrap;padding:7px 10px}
  nav.side .cnt{display:none}
  main{padding:18px 16px 70px}
  .g2,.g3,.scene-grid{grid-template-columns:1fr}
  .barrow{grid-template-columns:100px 1fr 88px}
  .col{flex-basis:250px}
  #sceneLower,#exportGrid{grid-template-columns:1fr!important}
}
/* print */
@media print{
  @page{margin:14mm}
  body{background:#fff;color:#111}
  #app,.toast,.login{display:none!important}
  #print{display:block}
}
.pr{font:11pt/1.4 var(--font);color:#111}
.pr h1{font-size:20pt;margin:0 0 2pt;font-weight:400;color:#111}
.pr .prmeta{color:#555;font-size:9.5pt;margin-bottom:12pt;border-bottom:1.5pt solid #1f3d74;padding-bottom:6pt}
.pr h2{font-size:13pt;margin:14pt 0 6pt;color:#1f3d74;font-weight:500}
.pr table{border-collapse:collapse;width:100%;font-size:9.5pt}
.pr th,.pr td{border:.5pt solid #bbb;padding:4pt 6pt;vertical-align:top;color:#111}
.pr th{background:#eef2f8;font-weight:600;text-transform:none;letter-spacing:0;font-size:9pt;color:#111}
.pr .sc{border:.75pt solid #bbb;border-radius:4pt;padding:8pt;margin-bottom:8pt;page-break-inside:avoid;display:grid;grid-template-columns:150pt 1fr;gap:10pt}
.pr .sc.noimg{grid-template-columns:1fr}
.pr .sc img{width:150pt;border-radius:3pt}
.pr .sc .h{font-weight:600;font-size:11pt}
.pr .sc .k{font-size:8.5pt;color:#666;text-transform:uppercase;letter-spacing:.04em;margin-top:4pt}
.pr .pre{white-space:pre-wrap}
.pr .seghead{page-break-after:avoid;break-after:avoid;background:#1f3d74;color:#fff;padding:4pt 8pt;border-radius:3pt;margin:12pt 0 6pt;font-weight:500;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pr .barrow .track{border-color:#ccc;background:#f2f2f2}
.pr .barrow .track i,.pr .chip .dot{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pr .barrow .val{color:#333}
.pr .avoid{page-break-inside:avoid}
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>
<script>
"use strict";
/* ============================================================
   PITCH-MEISTER 2.0 – Infomercial Storyboard & Projekttool
   Lokale Web-App: Daten im Browser (localStorage), JSON-Backup.
   ============================================================ */
const KEY = 'pitchmeister.v1';
const EMBED = !!window.PM_EMBED; // im claude.ai-Artifact: kein Druck, keine Downloads
const DEFAULT_CATS = ['LIVE','B-ROLL','FEATURE SEGMENT','DEMO','TESTIMONIAL','ANIMATION','OFFER / CTA'];
const DEFAULT_RCATS = ['VORSPEISE','HAUPTGANG','FISCH','FLEISCH','VEGETARISCH','DESSERT','SNACK'];
const PALETTE = ['#2d5aa8','#e0a21b','#2f8f5b','#c0392b','#8e44ad','#16a2b8','#d35400','#5d6d7e','#c2185b','#7cb342'];
const USER_COLORS = ['#2d5aa8','#2f8f5b','#c0392b','#8e44ad','#d35400','#16a2b8','#c2185b','#5d6d7e'];

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);
const sum = a => a.reduce((x, y) => x + (+y || 0), 0);

/* path binding: "scenes.<id>.name" -> arrays resolved by id */
function resolve(obj, keys) { for (const k of keys) { if (obj == null) return undefined; obj = Array.isArray(obj) ? obj.find(x => x.id === k) : obj[k]; } return obj; }
function setPath(root, path, val) { const keys = path.split('.'); const last = keys.pop(); const o = resolve(root, keys); if (o) o[last] = val; return o; }
const SECTION = { title:'Projekttitel', duration:'Showdauer', studio:'Studio', studioContact:'Studio-Kontakt', shootingDate:'Drehtermin', strategy:'Strategisches Konzept', hosts:'Host', setDesign:'Set-Design', offer:'Angebot', salesPoints:'Sales-Point', segments:'Segment', scenes:'Szene', animations:'Animation', brolls:'B-Roll', post:'Post-Shooting', notes:'Notiz' };
const FIELD = { name:'Name', duration:'Dauer', description:'Beschreibung', textVO:'Text/VO', recipe:'Rezept', ingredients:'Zutaten', recipeOn:'Rezept an/aus', recipeCategory:'Rezeptkategorie', segmentId:'Segment', text:'Text', itemId:'Produkt', contact:'Kontakt', role:'Rolle', specs:'Spezifikationen', overview:'Übersicht', price:'Preis', size:'Größe', spec:'Spezifikation', title:'Titel', link:'Link', caption:'Bildunterschrift', status:'Status', done:'erledigt', mediaUrl:'Clip-Link', priority:'Priorität', sceneId:'Szene', hex:'Farbe' };
function describe(path) {
  const keys = path.split('.'); const p = P();
  const sec = SECTION[keys[0]] || keys[0];
  if (keys.length === 1) return sec + ' geändert';
  if (keys[0] === 'setDesign' || keys[0] === 'offer') {
    if (keys[1] === 'items' && keys[2]) { const it = resolve(p, keys.slice(0, 3)); return `Produkt „${it?.name || '?'}“: ${FIELD[keys[3]] || keys[3]} geändert`; }
    if (keys[1] === 'colors' || keys[1] === 'images') return sec + ' geändert';
    return `${sec}: ${FIELD[keys[1]] || keys[1]} geändert`;
  }
  const ent = resolve(p, keys.slice(0, 2));
  const nm = ent ? (ent.name || ent.title || ent.text || '').slice(0, 40) : '';
  return `${sec} „${nm}“: ${FIELD[keys[2]] || keys[2]} geändert`;
}

function sceneMeta(p) {

  p.segments.forEach((seg, si) => { p.scenes.filter(s => s.segmentId === seg.id).forEach((s, i) => { m[s.id] = { no: `${si + 1}.${i + 1}`, start: t, seg, segIdx: si }; t += +s.duration || 0; }); });
  return m;
}

/* ---------- Storyboard ---------- */
function timeline(p, scenes) {
  const meta = sceneMeta(p);
  const total = sum(scenes.map(s => s.duration)) || 1;
  const groups = p.segments.map(seg => ({ seg, list: scenes.filter(s => s.segmentId === seg.id) })).filter(g => g.list.length);
  const usedCats = [...new Set(scenes.map(s => s.categories[0] || '—'))];
  return `<div class="timeline">${groups.map(g => { const t = sum(g.list.map(s => s.duration)); return `<div class="tl-seg" style="flex:${Math.max(t, 1)}">
    <div class="tl-bar">${g.list.map(s => `<div style="flex:${Math.max(+s.duration || 0, 1)};background:${s.categories[0] ? catColor(p, s.categories[0]) : 'var(--line2)'}" title="${esc(meta[s.id]?.no + ' ' + s.name + ' · ' + fmtDur(s.duration) + ' · ' + (s.categories.join(', ') || 'ohne Kategorie'))}" data-action="openScene" data-id="${s.id}"></div>`).join('')}</div>
    <div class="tl-lab"><b style="font-weight:500">${esc(g.seg.name)}</b> · ${fmtDur(t)} · ${pct(t, total)} %</div></div>`; }).join('')}</div>
  <div class="legend">${usedCats.map(c => `<span><i style="background:${c === '—' ? 'var(--line2)' : catColor(p, c)}"></i>${esc(c === '—' ? 'ohne Kategorie' : c)}</span>`).join('')}<span class="faint">Farbe = erste Kategorie der Szene</span></div>`;
}
function vStoryboard(p) {
  const scene = ui.sceneId && p.scenes.find(s => s.id === ui.sceneId);
  if (scene) return vScene(p, scene);
  ui.sceneId = null;
  const meta = sceneMeta(p), total = totalDur(p), diff = total - p.duration;
  let start = 0;
  return `<div class="pagehead"><div><h1>Storyboard</h1><div class="sub">Segment-Übersicht mit Timings, Kategorien &amp; Szenenboard · Szenen per Drag &amp; Drop verschieben</div></div>
    <div class="actions"><button class="btn" data-action="addSegment">+ Segment</button></div></div>
  <div class="kpis">
    <div class="kpi"><div class="l">Laufzeit Szenen</div><div class="v">${fmtDur(total)}</div><div class="d ${diff > 0 ? 'neg' : 'faint'}">${diff === 0 ? 'exakt im Ziel' : (diff > 0 ? '+' : '−') + fmtDur(Math.abs(diff)) + (diff > 0 ? ' über Ziel' : ' bis Ziel')}</div></div>
    <div class="kpi"><div class="l">Zieldauer Show</div><div class="v">${fmtDur(p.duration)}</div><div class="d faint">${pct(total, p.duration)} % gefüllt</div></div>
    <div class="kpi"><div class="l">Segmente / Szenen</div><div class="v">${p.segments.length} / ${p.scenes.length}</div></div>
    <div class="kpi"><div class="l">Ø Szenenlänge</div><div class="v">${fmtDur(p.scenes.length ? total / p.scenes.length : 0)}</div></div>
  </div>
  <div class="card" style="margin-bottom:16px"><h2>Zeitliche Verteilung</h2>${p.scenes.length ? timeline(p, ordered(p)) : '<div class="small faint">Noch keine Szenen.</div>'}</div>
  <div class="card" style="margin-bottom:16px"><h2>Segment-Übersicht</h2><div class="tbl-wrap"><table>
    <thead><tr><th>#</th><th>Segment</th><th class="num">Szenen</th><th class="num">Start</th><th class="num">Dauer</th><th class="num">Anteil</th><th>Kategorien</th><th></th></tr></thead>
    <tbody>${p.segments.map((seg, i) => { const l = p.scenes.filter(s => s.segmentId === seg.id), t = sum(l.map(s => s.duration)); const st = start; start += t; const cats = [...new Set(l.flatMap(s => s.categories))];
      return `<tr><td>${i + 1}</td><td>${esc(seg.name)}</td><td class="num">${l.length}</td><td class="num">${fmtDur(st)}</td><td class="num">${fmtDur(t)}</td><td class="num">${pct(t, total)} %</td><td>${catChips(p, cats)}</td>
      <td style="white-space:nowrap"><button class="btn sm ghost" data-action="moveSeg" data-id="${seg.id}" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="nach oben">↑</button><button class="btn sm ghost" data-action="moveSeg" data-id="${seg.id}" data-d="1" ${i === p.segments.length - 1 ? 'disabled' : ''} aria-label="nach unten">↓</button>${del('delSegment', { id: seg.id }, 'Segment löschen')}</td></tr>`; }).join('')}
    <tr><td></td><td><b style="font-weight:500">Total</b></td><td class="num">${p.scenes.length}</td><td></td><td class="num"><b style="font-weight:500">${fmtDur(total)}</b></td><td class="num">100 %</td><td></td><td></td></tr></tbody></table></div></div>
  <h2>Szenenboard</h2>
  <div class="board">${p.segments.map((seg, si) => { const l = p.scenes.filter(s => s.segmentId === seg.id);
    return `<div class="col" data-drop-seg="${seg.id}">
      <div class="colhead"><span class="chip">${si + 1}</span>${inp(`segments.${seg.id}.name`, seg.name, 'aria-label="Segmentname"')}<span class="small faint" style="white-space:nowrap">${fmtDur(segDur(p, seg.id))}</span></div>
      ${l.map(s => `<div class="scard" draggable="true" data-drag-scene="${s.id}" data-action="openScene" data-id="${s.id}">
        <div class="thumb">${sceneThumb(s)}<span class="num">${meta[s.id].no}</span><span class="dur">${fmtDur(s.duration)}</span></div>
        <div class="body"><div class="name">${esc(s.name)}</div>
          <div class="row" style="gap:4px">${catChips(p, s.categories)}${s.recipeOn ? `<span class="chip" style="border-color:${rcatColor(p, s.recipeCategory)}">🍳 ${esc(s.recipeCategory || 'Rezept')}</span>` : ''}</div>
          <div class="small faint">${s.itemIds.length} Produkt(e) · ${s.salesPointIds.length} Sales-Point(s)${s.comments.length ? ' · 💬 ' + s.comments.length : ''} · ab ${fmtDur(meta[s.id].start)}</div></div></div>`).join('')}
      <button class="addscene" data-action="addScene" data-seg="${seg.id}">+ Szene</button></div>`; }).join('')}</div>`;
}

function vScene(p, s) {
  const meta = sceneMeta(p), m = meta[s.id], ord = ordered(p), idx = ord.indexOf(s);
  const prev = ord[idx - 1], next = ord[idx + 1];
  const b = k => `scenes.${s.id}.${k}`;
  const itemSet = new Set(s.itemIds);
  const spRelevant = p.salesPoints.filter(sp => sp.itemId && itemSet.has(sp.itemId));
  const spGeneral = p.salesPoints.filter(sp => !sp.itemId || !p.offer.items.some(i => i.id === sp.itemId));
  const spOther = p.salesPoints.filter(sp => !spRelevant.includes(sp) && !spGeneral.includes(sp));
  const spList = (title, list) => list.length ? `<div class="grouphead">${title}</div>` + list.map(sp => `<label class="${s.salesPointIds.includes(sp.id) ? 'on' : ''}"><input type="checkbox" data-action="toggle" data-list="${b('salesPointIds')}" data-val="${sp.id}" ${s.salesPointIds.includes(sp.id) ? 'checked' : ''}><span>${esc(sp.text)}${sp.itemId ? ` <span class="faint small">· ${esc(p.offer.items.find(i => i.id === sp.itemId)?.name || '')}</span>` : ''}</span></label>`).join('') : '';
  const anims = p.animations;
  const tabs = [['desc', 'Beschreibung'], ['sp', 'Sales-Points in Szene', s.salesPointIds.length], ['vo', 'Text / VO']];
  return `<div class="pagehead"><div>
      <button class="btn sm ghost" data-action="closeScene" style="margin:0 0 6px -10px">← Szenenboard</button>
      <h1>Szene ${m.no}</h1><div class="sub">${esc(m.seg.name)} · Timecode ${fmtDur(m.start)} – ${fmtDur(m.start + (+s.duration || 0))}</div></div>
    <div class="actions">
      <button class="btn" data-action="openScene" data-id="${prev?.id || ''}" ${prev ? '' : 'disabled'}>‹ Vorherige</button>
      <button class="btn" data-action="openScene" data-id="${next?.id || ''}" ${next ? '' : 'disabled'}>Nächste ›</button>
      <button class="btn" data-action="dupScene" data-id="${s.id}">Duplizieren</button>
      <button class="btn danger" data-action="delScene" data-id="${s.id}">Löschen</button></div></div>
  <div class="scene-grid">
    <div class="card stack">
      ${field('Bezeichnung der Szene', inp(b('name'), s.name, 'placeholder="Name of scene"'))}
      <div class="media">${s.media?.src ? mediaTag(s.media) : (s.mediaUrl ? (/\.(mp4|webm|mov)(\?|$)/i.test(s.mediaUrl) ? `<video src="${esc(s.mediaUrl)}" controls muted playsinline></video>` : /\.(png|jpe?g|gif|webp)(\?|$)/i.test(s.mediaUrl) ? `<img src="${esc(s.mediaUrl)}" alt="">` : `<a href="${esc(s.mediaUrl)}" target="_blank" rel="noopener">Clip öffnen ↗</a>`) : '<div>Bild oder Clip<br><span class="small faint">Scribble, Foto oder kurzes Video</span></div>')}
        <div class="ov"><button class="btn sm" data-action="upload" data-mode="set" data-path="${b('media')}" data-accept="image/*,video/*">${s.media ? 'Ersetzen' : 'Hochladen'}</button>${s.media ? `<button class="btn sm danger" data-action="clearMedia" data-id="${s.id}">Entfernen</button>` : ''}</div></div>
      ${field('oder Link zu Clip / Bild', inp(b('mediaUrl'), s.mediaUrl, 'placeholder="https://…" data-rerender'))}
    </div>
    <div class="card stack">
      <div class="grid g2">${field('Dauer', durInp(b('duration'), s.duration))}${field('Segment', sel(b('segmentId'), s.segmentId, p.segments.map(x => [x.id, x.name]), 'data-rerender'))}</div>
      <div class="field"><span>Produkte / Teile in Szene</span>
        <div class="checklist">${p.offer.items.length ? p.offer.items.map(it => `<label class="${itemSet.has(it.id) ? 'on' : ''}"><input type="checkbox" data-action="toggle" data-list="${b('itemIds')}" data-val="${it.id}" ${itemSet.has(it.id) ? 'checked' : ''}><span>${esc(it.name)}${it.size ? ` <span class="faint small">${esc(it.size)}</span>` : ''}</span></label>`).join('') : '<div class="small faint" style="padding:10px">Keine Produkte – unter „Angebot“ anlegen.</div>'}</div></div>
    </div>
    <div class="card stack c3">
      <div class="field"><span>Kategorie</span>
        <div class="checklist">${p.categories.map(c => `<label class="${s.categories.includes(c) ? 'on' : ''}"><input type="checkbox" data-action="toggle" data-list="${b('categories')}" data-val="${esc(c)}" ${s.categories.includes(c) ? 'checked' : ''}><span class="chip"><span class="dot" style="background:${catColor(p, c)}"></span>${esc(c)}</span></label>`).join('')}</div></div>
      <label class="toggle"><input type="checkbox" data-bind="${b('recipeOn')}" data-rerender ${s.recipeOn ? 'checked' : ''}> Rezept in dieser Szene</label>
      ${s.recipeOn ? field('Rezept-Kategorie', sel(b('recipeCategory'), s.recipeCategory, [['', '— wählen —'], ...p.recipeCategories.map(c => [c, c])], 'data-rerender')) : ''}
      ${anims.length ? `<div class="field"><span>Verknüpfte Animationen</span><div class="row" style="gap:6px">${anims.map(a => `<label class="chip" style="cursor:pointer;padding:3px 9px"><input type="checkbox" data-action="toggleAnim" data-anim="${a.id}" data-scene="${s.id}" ${a.sceneIds.includes(s.id) ? 'checked' : ''}> ${esc(a.name)}</label>`).join('')}</div></div>` : ''}
    </div>
  </div>
  <div class="grid" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);margin-top:16px" id="sceneLower">

/* ---------- Analysis ---------- */
function stats(p, segId = 'all') {
  const all = ordered(p), sc = segId === 'all' ? all : all.filter(s => s.segmentId === segId);
  const total = sum(sc.map(s => s.duration));
  const agg = (list, pred) => { const l = list.filter(pred); return { count: l.length, time: sum(l.map(s => s.duration)), scenes: l }; };
  return {
    sc, total,
    cats: p.categories.map(c => ({ name: c, color: catColor(p, c), ...agg(sc, s => s.categories.includes(c)) })),
    noCat: agg(sc, s => !s.categories.length),
    recipes: p.recipeCategories.map(c => ({ name: c, color: rcatColor(p, c), ...agg(sc, s => s.recipeOn && s.recipeCategory === c) })),
    recipeTotal: agg(sc, s => s.recipeOn),
    items: p.offer.items.map(it => ({ name: it.name, color: 'var(--brand2)', ...agg(sc, s => s.itemIds.includes(it.id)) })),
    sps: p.salesPoints.map(sp => ({ name: sp.text, item: p.offer.items.find(i => i.id === sp.itemId)?.name || 'Generell', color: 'var(--accent)', ...agg(sc, s => s.salesPointIds.includes(sp.id)) })),
    segs: p.segments.map(seg => ({ name: seg.name, color: 'var(--brand)', ...agg(all, s => s.segmentId === seg.id) }))
  };
}
function bars(rows, mode, total, empty = 'Keine Daten') {
  const vis = rows.filter(r => r.count > 0 || mode === 'all');
  if (!vis.length) return `<div class="small faint">${empty}</div>`;
  const max = Math.max(...vis.map(r => mode === 'count' ? r.count : r.time), 1);
  return `<div class="bars">${vis.map(r => { const v = mode === 'count' ? r.count : r.time;
    return `<div class="barrow"><span class="lab" title="${esc(r.name)}">${esc(r.name)}</span><span class="track"><i style="width:${v / max * 100}%;background:${r.color}"></i></span><span class="val">${mode === 'count' ? r.count + '×' : fmtDur(r.time)}${total ? ' · ' + pct(mode === 'count' ? r.count : r.time, total) + ' %' : ''}</span></div>`; }).join('')}</div>`;
}
function analysisHTML(p, segId, print = false) {
  const st = stats(p, segId), meta = sceneMeta(p);
  const segName = segId === 'all' ? 'Total (alle Segmente)' : p.segments.find(s => s.id === segId)?.name;
  const spUsed = st.sps.filter(s => s.count), spUnused = st.sps.filter(s => !s.count);
  const card = (title, inner, cls = '') => `<div class="card avoid ${cls}">${print ? `<h2>${title}</h2>` : `<h2>${title}</h2>`}${inner}</div>`;
  const sceneRefs = l => l.map(s => meta[s.id].no).join(', ');
  return `
  <div class="kpis">
    <div class="kpi"><div class="l">Laufzeit · ${esc(segName)}</div><div class="v">${fmtDur(st.total)}</div><div class="d faint">${segId === 'all' ? 'Ziel ' + fmtDur(p.duration) + ' · ' + pct(st.total, p.duration) + ' %' : pct(st.total, totalDur(p)) + ' % der Show'}</div></div>
    <div class="kpi"><div class="l">Szenen</div><div class="v">${st.sc.length}</div><div class="d faint">Ø ${fmtDur(st.sc.length ? st.total / st.sc.length : 0)}</div></div>
    <div class="kpi"><div class="l">Sales-Points genutzt</div><div class="v">${spUsed.length}/${st.sps.length}</div><div class="d ${spUnused.length ? 'neg' : 'pos'}">${spUnused.length ? spUnused.length + ' ungenutzt' : 'alle verwendet'}</div></div>
    <div class="kpi"><div class="l">Rezept-Szenen</div><div class="v">${st.recipeTotal.count}</div><div class="d faint">${fmtDur(st.recipeTotal.time)} · ${pct(st.recipeTotal.time, st.total)} %</div></div>
  </div>
  ${segId === 'all' ? card('Zeitliche Verteilung der Szenen (Segmente)', (p.scenes.length ? timeline(p, st.sc) : '') + `<div style="margin-top:14px">${bars(st.segs, 'time', st.total)}</div>`) : card('Zeitliche Verteilung im Segment', timeline(p, st.sc))}
  <div class="grid g2" style="margin-top:16px">
    ${card('Verteilung der Kategorien – Zeit', bars([...st.cats, { name: 'ohne Kategorie', color: 'var(--line2)', ...st.noCat }], 'time', st.total) + '<div class="small faint" style="margin-top:8px">Mehrfachzuordnung möglich – Summe kann 100 % übersteigen.</div>')}
    ${card('Verteilung der Kategorien – Anzahl', bars([...st.cats, { name: 'ohne Kategorie', color: 'var(--line2)', ...st.noCat }], 'count', st.sc.length))}
    ${card('Verteilung der Rezept-Kategorien', bars(st.recipes, 'time', st.recipeTotal.time, 'Keine Rezepte im Auswahlbereich') + `<div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>Kategorie</th><th class="num">Anz.</th><th class="num">Zeit</th><th>Szenen</th></tr></thead><tbody>${st.recipes.filter(r => r.count).map(r => `<tr><td>${esc(r.name)}</td><td class="num">${r.count}</td><td class="num">${fmtDur(r.time)}</td><td class="small">${sceneRefs(r.scenes)}</td></tr>`).join('') || '<tr><td colspan="4" class="faint">–</td></tr>'}</tbody></table></div>`)}
    ${card('Wo und wie oft wird welches Produkt benutzt', bars(st.items, 'count', 0, 'Keine Produkte verwendet') + `<div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>Produkt</th><th class="num">Szenen</th><th class="num">Zeit im Bild</th><th>Wo</th></tr></thead><tbody>${st.items.map(r => `<tr><td>${esc(r.name)}</td><td class="num">${r.count}</td><td class="num">${fmtDur(r.time)}</td><td class="small">${sceneRefs(r.scenes) || '<span class="neg">nicht verwendet</span>'}</td></tr>`).join('')}</tbody></table></div>`)}
  </div>
  <div style="margin-top:16px">${card('Wo sind welche Sales-Points verteilt', `<div class="tbl-wrap"><table><thead><tr><th>Sales-Point</th><th>Produkt</th><th class="num">Anz.</th><th class="num">Zeit</th><th>Szenen</th></tr></thead><tbody>${st.sps.sort((a, b) => b.count - a.count).map(r => `<tr><td>${esc(r.name)}</td><td class="small">${esc(r.item)}</td><td class="num">${r.count}</td><td class="num">${fmtDur(r.time)}</td><td class="small">${r.count ? sceneRefs(r.scenes) : '<span class="neg">nicht verwendet</span>'}</td></tr>`).join('')}</tbody></table></div>`)}</div>
  <div style="margin-top:16px">${card('Zeitliche Aufschlüsselung – wie setzt sich welches Segment zusammen', `<div class="tbl-wrap"><table><thead><tr><th>Nr.</th><th>Szene</th><th>Segment</th><th>Kategorien</th><th class="num">Start</th><th class="num">Dauer</th><th class="num">Anteil</th></tr></thead><tbody>${st.sc.map(s => `<tr><td>${meta[s.id].no}</td><td>${esc(s.name)}</td><td class="small">${esc(meta[s.id].seg.name)}</td><td>${catChips(p, s.categories)}</td><td class="num">${fmtDur(meta[s.id].start)}</td><td class="num">${fmtDur(s.duration)}</td><td class="num">${pct(s.duration, st.total)} %</td></tr>`).join('')}</tbody></table></div>`)}</div>`;
}
function vAnalysis(p) {
  return `<div class="pagehead"><div><h1>Analyse</h1><div class="sub">Numerisch, prozentual und als Diagramm – pro Segment und Total</div></div>
    <div class="actions"><select data-action-change="segFilter" style="width:auto">${[['all', 'Total – alle Segmente'], ...p.segments.map(s => [s.id, 'Segment: ' + s.name])].map(([v, l]) => `<option value="${v}" ${ui.segFilter === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
    ${EMBED ? '' : '<button class="btn pri" data-action="printAnalysis">Drucken / PDF</button>'}</div></div>
  ${p.scenes.length ? analysisHTML(p, ui.segFilter) : '<div class="empty">Noch keine Szenen im Storyboard – die Analyse füllt sich automatisch.</div>'}`;
}

/* ---------- Export ---------- */
const LAYOUTS = [
  ['storyboard', 'Storyboard komplett', 'Alle Szenen mit Bild, Beschreibung, Text/VO, Produkten, Sales-Points, Rezept und Kommentaren.'],
  ['kitchen', 'Kitchen-Crew', 'Rezept-Szenen mit Zutaten, benötigten Produkten und Timecode – plus Einkaufsliste.'],
  ['stage', 'Stage-Crew', 'Ablaufplan: Timecode, Szene, Kategorie, Produkte/Requisiten, Set-Spezifikationen.'],
  ['shopping', 'Einkaufsliste', 'Alle Zutaten aus den Rezepten zusammengefasst, mit Szenen-Referenz.'],
  ['sp', 'Sales-Points pro Szene', 'Welche Sales-Points in welcher Szene vorkommen + ungenutzte Sales-Points.'],
  ['lists', 'B-Rolls & Post-Shooting', 'Offene B-Rolls und Nachdreh-Liste.'],
  ['analysis', 'Analyse', 'Alle Auswertungen (Total) als Report.']
];
function exportHTML(p, layout, withImg) {
  const meta = sceneMeta(p), ord = ordered(p);
  const L = LAYOUTS.find(l => l[0] === layout);
  const head = `<h1>${esc(p.title)}</h1><div class="prmeta">${esc(L[1])} · Showdauer ${fmtDur(p.duration)} (Szenen ${fmtDur(totalDur(p))}) · Studio: ${esc(p.studio || '–')} · Dreh: ${fmtDay(p.shootingDate)} · Stand ${fmtDate(Date.now())} · ${esc(me()?.name || '')}</div>`;
  const items = s => s.itemIds.map(id => p.offer.items.find(i => i.id === id)?.name).filter(Boolean).join(', ');
  const sps = s => s.salesPointIds.map(id => p.salesPoints.find(x => x.id === id)?.text).filter(Boolean);
  const img = s => withImg && s.media?.src && s.media.type !== 'video' ? `<img src="${esc(s.media.src)}" alt="">` : '';
  let body = '';
  if (layout === 'storyboard') {
    body = p.segments.map((seg, si) => `<div class="seghead">${si + 1}. ${esc(seg.name)} · ${fmtDur(segDur(p, seg.id))}</div>` + p.scenes.filter(s => s.segmentId === seg.id).map(s => { const im = img(s);
      return `<div class="sc ${im ? '' : 'noimg'}">${im ? `<div>${im}</div>` : ''}<div><div class="h">${meta[s.id].no} ${esc(s.name)} <span style="font-weight:400;color:#666">· ${fmtDur(meta[s.id].start)} · ${fmtDur(s.duration)} · ${esc(s.categories.join(', '))}</span></div>
      ${s.description ? `<div class="k">Beschreibung</div><div class="pre">${esc(s.description)}</div>` : ''}
      ${s.textVO ? `<div class="k">Text / VO</div><div class="pre">${esc(s.textVO)}</div>` : ''}
      ${s.itemIds.length ? `<div class="k">Produkte</div><div>${esc(items(s))}</div>` : ''}
      ${sps(s).length ? `<div class="k">Sales-Points</div><div>${sps(s).map(esc).join(' · ')}</div>` : ''}
      ${s.recipeOn ? `<div class="k">Rezept (${esc(s.recipeCategory || '–')})</div><div class="pre">${esc(s.recipe)}</div>` : ''}
      ${s.comments.length ? `<div class="k">Kommentare</div>${s.comments.map(c => `<div>${esc(userById(c.user)?.name || '')}: ${esc(c.text)}</div>`).join('')}` : ''}</div></div>`; }).join('')).join('');
  } else if (layout === 'kitchen') {
    const rs = ord.filter(s => s.recipeOn);
    body = rs.length ? `<table><thead><tr><th>Nr.</th><th>Timecode</th><th>Szene</th><th>Rezept</th><th>Kategorie</th><th>Zutaten</th><th>Produkte / Geräte</th></tr></thead><tbody>${rs.map(s => `<tr><td>${meta[s.id].no}</td><td>${fmtDur(meta[s.id].start)}</td><td>${esc(s.name)}</td><td class="pre">${esc(s.recipe)}</td><td>${esc(s.recipeCategory)}</td><td class="pre">${esc(s.ingredients)}</td><td>${esc(items(s))}</td></tr>`).join('')}</tbody></table>` + '<h2>Einkaufsliste</h2>' + shoppingTable(p) : '<p>Keine Rezept-Szenen.</p>';
  } else if (layout === 'stage') {
    body = `<table><thead><tr><th>Nr.</th><th>Start</th><th>Dauer</th><th>Segment</th><th>Szene</th><th>Kategorie</th><th>Produkte / Requisiten</th><th>Animation / B-Roll</th></tr></thead><tbody>${ord.map(s => `<tr><td>${meta[s.id].no}</td><td>${fmtDur(meta[s.id].start)}</td><td>${fmtDur(s.duration)}</td><td>${esc(meta[s.id].seg.name)}</td><td>${esc(s.name)}</td><td>${esc(s.categories.join(', '))}</td><td>${esc(items(s))}</td><td>${esc([...p.animations.filter(a => a.sceneIds.includes(s.id)).map(a => '▶ ' + a.name), ...p.brolls.filter(r => r.sceneId === s.id).map(r => '🎥 ' + r.name)].join(', '))}</td></tr>`).join('')}</tbody></table>
      <h2>Set-Design</h2><div class="pre">${esc(p.setDesign.specs || '–')}</div>
      ${p.setDesign.colors.length ? `<p>${p.setDesign.colors.map(c => `<span class="chip"><span class="dot" style="background:${esc(c.hex)}"></span>${esc(c.name)} ${esc(c.hex)}</span>`).join(' ')}</p>` : ''}
      ${p.hosts.length ? `<h2>Hosts</h2><table><tbody>${p.hosts.map(h => `<tr><td>${esc(h.name)}</td><td>${esc(h.role)}</td><td>${esc(h.contact)}</td></tr>`).join('')}</tbody></table>` : ''}`;
  } else if (layout === 'shopping') {
    body = shoppingTable(p) + `<h2>Produkte aus dem Angebot</h2><table><thead><tr><th>Produkt</th><th>Größe</th><th>Anzahl Szenen</th></tr></thead><tbody>${p.offer.items.map(i => `<tr><td>${esc(i.name)}</td><td>${esc(i.size)}</td><td>${p.scenes.filter(s => s.itemIds.includes(i.id)).length}</td></tr>`).join('')}</tbody></table>`;
  } else if (layout === 'sp') {
    body = `<table><thead><tr><th>Nr.</th><th>Szene</th><th>Dauer</th><th>Sales-Points</th></tr></thead><tbody>${ord.map(s => `<tr><td>${meta[s.id].no}</td><td>${esc(s.name)}</td><td>${fmtDur(s.duration)}</td><td>${sps(s).map(esc).join('<br>') || '–'}</td></tr>`).join('')}</tbody></table>`;
    const unused = p.salesPoints.filter(sp => !p.scenes.some(s => s.salesPointIds.includes(sp.id)));

function ask(msg, yes = 'Löschen') {
  return new Promise(res => {
    const w = document.createElement('div'); w.className = 'modal';
    w.innerHTML = `<div class="mbox" role="dialog" aria-modal="true"><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-m="0">Abbrechen</button><button class="btn pri" data-m="1">${esc(yes)}</button></div></div>`;
    const done = v => { w.remove(); document.removeEventListener('keydown', key, true); res(v); };
    const key = e => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
    w.addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b) done(b.dataset.m === '1'); else if (e.target === w) done(false); });
    document.addEventListener('keydown', key, true);
    document.body.appendChild(w); w.querySelector('[data-m="1"]').focus();
  });
}

/* uploads (images are downscaled to keep storage small) */
function pickFiles(d) {
  const i = document.createElement('input'); i.type = 'file'; i.accept = d.accept || 'image/*'; if (d.multi) i.multiple = true;
  i.onchange = async () => {
    const p = P();
    for (const f of i.files) {
      let m;
      if (f.type.startsWith('image/')) m = { type: 'image', src: await downscale(f, 1280) };
      else if (f.type.startsWith('video/')) { if (f.size > 4 * 1024 * 1024) { toast('Video ist größer als 4 MB – bitte als Link zum Clip eintragen.'); continue; } m = { type: 'video', src: await readURL(f) }; }
      else continue;
      if (d.mode === 'push') { resolve(p, d.path.split('.')).push({ id: uid(), caption: f.name.replace(/\.[^.]+$/, ''), ...m }); }
      else setPath(p, d.path, m);
    }
    commit(describe(d.path.replace(/\.(media|image|preview|images)$/, '') + '.' + (d.mode === 'push' ? 'images' : 'Bild')), d.path);
  };
  i.click();
}
const readURL = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
function downscale(f, max) {
  return new Promise(res => { const img = new Image(); const url = URL.createObjectURL(f); img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .82)); }; img.onerror = () => { URL.revokeObjectURL(url); readURL(f).then(res); }; img.src = url; });
}

/* ---------- events ---------- */
document.addEventListener('click', e => {

  if (el.type === 'checkbox' || el.tagName === 'INPUT' && el.type !== 'checkbox') { /* checkboxes with data-action handled on change */ if (el.type === 'checkbox') return; }
  const fn = A[el.dataset.action]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  fn(el.dataset, el, e);
});
function applyBind(el, isChange) {
  const p = P(); if (!p) return;
  const t = el.dataset.type || el.type; let v;
  if (t === 'checkbox') v = el.checked;
  else if (t === 'dur') { if (!isChange) return; v = parseDur(el.value); el.value = fmtDur(v); }
  else v = el.value;
  if (el.dataset.bind.endsWith('.itemId') && !v) v = null;
  setPath(p, el.dataset.bind, v);
  log(describe(el.dataset.bind), el.dataset.bind);
  save();
}
document.addEventListener('input', e => { const el = e.target.closest('[data-bind]'); if (el && el.type !== 'checkbox' && el.tagName !== 'SELECT') applyBind(el, false); });
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('[data-bind]')) { applyBind(el, true); if (el.dataset.rerender !== undefined || el.type === 'checkbox' || el.tagName === 'SELECT') render(); return; }
  if (el.type === 'checkbox' && el.dataset.action) { A[el.dataset.action](el.dataset, el, e); return; }
  if (el.id === 'projSel') { S.activeProjectId = el.value; ui.sceneId = null; if (ui.view === 'projects') ui.view = 'storyboard'; save(); render(); return; }
  const ac = el.dataset.actionChange;

document.addEventListener('keydown', e => {

/* drag & drop scenes between segments */
let dragId = null;
document.addEventListener('dragstart', e => { const c = e.target.closest?.('[data-drag-scene]'); if (!c) return; dragId = c.dataset.dragScene; e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging'); });
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.dragging,.drop,.dropbefore').forEach(x => x.classList.remove('dragging', 'drop', 'dropbefore')); });
document.addEventListener('dragover', e => { const col = e.target.closest?.('[data-drop-seg]'); if (!col || !dragId) return; e.preventDefault(); document.querySelectorAll('.drop,.dropbefore').forEach(x => x.classList.remove('drop', 'dropbefore')); col.classList.add('drop'); const before = e.target.closest('[data-drag-scene]'); if (before && before.dataset.dragScene !== dragId) before.classList.add('dropbefore'); });
document.addEventListener('drop', e => {
  const col = e.target.closest?.('[data-drop-seg]'); if (!col || !dragId) return; e.preventDefault();
  const p = P(), s = p.scenes.find(x => x.id === dragId); if (!s) return;
  const beforeId = e.target.closest('[data-drag-scene]')?.dataset.dragScene;
  p.scenes.splice(p.scenes.indexOf(s), 1); s.segmentId = col.dataset.dropSeg;
  if (beforeId && beforeId !== s.id) p.scenes.splice(p.scenes.findIndex(x => x.id === beforeId), 0, s);
  else { const l = p.scenes.filter(x => x.segmentId === s.segmentId); p.scenes.splice(l.length ? p.scenes.indexOf(l[l.length - 1]) + 1 : p.scenes.length, 0, s); }
  dragId = null; commit(`Szene „${s.name}“ verschoben`);
});
window.addEventListener('storage', e => { if (e.key === KEY) { const d = load(); if (d) { const cu = S.currentUser; S = d; S.currentUser = cu; render(); } } });

try { const th = localStorage.getItem(KEY + '.theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
render();
</script>
</body>
</html>
